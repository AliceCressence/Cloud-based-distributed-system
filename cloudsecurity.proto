syntax = "proto3";

package cloudsecurity;

service UserService {
    rpc login(Request) returns (Response);
    rpc Enroll(EnrollRequest) returns (Response);
    rpc VerifyOTP(VerifyOTPRequest) returns (Response);
    rpc AddNode(AddNodeRequest) returns (Response);
    rpc ConnectNodes(ConnectNodesRequest) returns (Response);
    rpc InitiateFileTransfer(FileTransferRequest) returns (Response);
    rpc ProcessFileTransfer(ProcessTransferRequest) returns (Response);
    rpc GetNetworkStats(Empty) returns (Response);
}

message Request {
    string login = 1;
    string password = 2;
}

message EnrollRequest {
    string username = 1;
    string email = 2;
    string password = 3;
}

message VerifyOTPRequest {
    string email = 1;
    string otp = 2;
}

message AddNodeRequest {
    string node_id = 1;
    int32 cpu_capacity = 2;
    int32 memory_capacity = 3;
    int32 storage_capacity = 4;
    int32 bandwidth = 5;
}

message ConnectNodesRequest {
    string node1_id = 1;
    string node2_id = 2;
    int32 bandwidth = 3;
}

message FileTransferRequest {
    string source_node_id = 1;
    string target_node_id = 2;
    string file_name = 3;
    int64 file_size = 4;
}

message ProcessTransferRequest {
    string source_node_id = 1;
    string target_node_id = 2;
    string file_id = 3;
    int32 chunks_per_step = 4;
}

message Empty {}

message Response {
    string result = 1;
}